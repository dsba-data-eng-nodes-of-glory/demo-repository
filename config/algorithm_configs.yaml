training_options:
  validation_fraction: 0.15
algorithms:
  lstm:
    epochs: 8
    batch_size: 10
    hidden_size: 64
    learning_rate: 0.001
    max_train_windows: 400
    max_validation_windows: 80
    patience: 4
  random_forest:
    n_estimators: 150
    max_depth: 16
    min_samples_leaf: 2
    max_train_origins: 300
    max_validation_origins: 80
    random_state: 42
    n_jobs: 1
  gbt:
    max_iter: 120
    max_leaf_nodes: 31
    learning_rate: 0.08
    l2_regularization: 0.001
    max_train_origins: 300
    max_validation_origins: 80
    random_state: 42
  xgboost:
    n_estimators: 250
    max_depth: 10
    learning_rate: 0.0025
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    max_train_origins: 300
    max_validation_origins: 80
    random_state: 42
    n_jobs: 1
  dense_nn:
    hidden_layer_sizes: 128,64
    max_iter: 160
    learning_rate_init: 0.001
    alpha: 0.0001
    random_state: 42
    max_train_origins: 240
    max_validation_origins: 60
renewable_algorithms:
  dense_nn:
    epochs: 25
    batch_size: 256
    hidden_1: 256
    hidden_2: 128
    hidden_3: 64
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 1.0e-05
    patience: 5
    max_train_origins: 512
    max_validation_origins: 128
    random_state: 42
  lstm:
    epochs: 18
    batch_size: 8
    hidden_size: 64
    learning_rate: 0.001
    patience: 4
    max_train_origins: 256
    max_validation_origins: 64
    random_state: 42
  random_forest:
    n_estimators: 80
    max_depth: 16
    min_samples_leaf: 2
    n_jobs: 1
    max_train_origins: 200
    max_validation_origins: 50
    random_state: 42
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: 1
    max_train_origins: 160
    max_validation_origins: 40
    random_state: 42
  gbt:
    max_iter: 100
    max_leaf_nodes: 31
    learning_rate: 0.07
    l2_regularization: 0.001
    max_train_origins: 160
    max_validation_origins: 40
    random_state: 42
anomaly_algorithms:
  dense_autoencoder:
    epochs: 80
    batch_size: 256
    learning_rate: 0.001
    hidden_dim: 256
    bottleneck_dim: 32
    patience: 5
    train_stride: 24
    stat_quantile: 0.99
    ae_quantile: 0.99
    validation_fraction: 0.10
    seed: 42
    num_threads: 2
    train_fraction: 0.8
component_algorithms:
  demand_forecast:
  - dense_nn
  - lstm
  - random_forest
  - xgboost
  - gbt
  solar_forecast:
  - dense_nn
  - lstm
  - random_forest
  - xgboost
  - gbt
  wind_forecast:
  - dense_nn
  - lstm
  - random_forest
  - xgboost
  - gbt
  residual_anomaly:
  - dense_autoencoder
