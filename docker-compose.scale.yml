name: electricity-scale

x-kafka-common: &kafka-common
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  # ------------------------- Kafka KRaft cluster -------------------------
  kafka-1:
    image: apache/kafka:4.0.0
    hostname: kafka-1
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:9094"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:4.0.0
    hostname: kafka-2
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29092
    ports:
      - "29092:9094"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:4.0.0
    hostname: kafka-3
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39092
    ports:
      - "39092:9094"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ----------------------- Cassandra 3-node ring ------------------------
  cassandra-1:
    image: cassandra:4.1
    hostname: cassandra-1
    environment:
      CASSANDRA_CLUSTER_NAME: electricity-cluster
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "9042:9042"
    volumes:
      - cassandra1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  cassandra-2:
    image: cassandra:4.1
    hostname: cassandra-2
    environment:
      CASSANDRA_CLUSTER_NAME: electricity-cluster
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack2
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    depends_on:
      cassandra-1:
        condition: service_healthy
    volumes:
      - cassandra2_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  cassandra-3:
    image: cassandra:4.1
    hostname: cassandra-3
    environment:
      CASSANDRA_CLUSTER_NAME: electricity-cluster
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack3
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    depends_on:
      cassandra-1:
        condition: service_healthy
    volumes:
      - cassandra3_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # ----------------------- Spark standalone cluster --------------------
  spark-master:
    image: apache/spark:3.5.6
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "7077:7077"
      - "8081:8080"
    restart: unless-stopped

  spark-worker-1:
    image: apache/spark:3.5.6
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    depends_on:
      - spark-master
    restart: unless-stopped

  spark-worker-2:
    image: apache/spark:3.5.6
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    depends_on:
      - spark-master
    restart: unless-stopped

  # --------------------- API + dashboard application -------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app-env
      STORAGE_BACKEND: cassandra
      CASSANDRA_CONTACT_POINTS: cassandra-1,cassandra-2,cassandra-3
      CASSANDRA_LOCAL_DATACENTER: dc1
      CASSANDRA_REPLICATION_STRATEGY: NetworkTopologyStrategy
      CASSANDRA_REPLICATION_RF: 3
      CASSANDRA_CONSISTENCY_LEVEL: LOCAL_QUORUM
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC_PARTITIONS: 1
      KAFKA_TOPIC_REPLICATION_FACTOR: 3
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_LOCAL_HOSTNAME: api
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      ELECTRICITY_API_URL: http://api:8000
      QUALITY_CONSUMER_EXTERNAL: "true"
      SPARK_SHUFFLE_PARTITIONS: 12
      SPARK_MAX_OFFSETS_PER_TRIGGER: 50000
    ports:
      - "8000:8000"
      - "9102-9105:9102-9105"
    volumes:
      - .:/app
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      cassandra-1:
        condition: service_healthy
      cassandra-2:
        condition: service_healthy
      cassandra-3:
        condition: service_healthy
      spark-master:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      ELECTRICITY_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped


  quality-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    command: ["python", "-u", "-m", "src.quality.dlq_consumer"]
    environment:
      STORAGE_BACKEND: cassandra
      CASSANDRA_CONTACT_POINTS: cassandra-1,cassandra-2,cassandra-3
      CASSANDRA_LOCAL_DATACENTER: dc1
      CASSANDRA_REPLICATION_STRATEGY: NetworkTopologyStrategy
      CASSANDRA_REPLICATION_RF: 3
      CASSANDRA_CONSISTENCY_LEVEL: LOCAL_QUORUM
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    volumes:
      - .:/app
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      cassandra-1:
        condition: service_healthy
      cassandra-2:
        condition: service_healthy
      cassandra-3:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------- Monitoring -------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:
  prometheus_data:
  grafana_data:
